<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUTS Governance | Constitutional Compliance Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght=300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030712; color: #cbd5e1; font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Share Tech Mono', monospace; }
        .glow-blue { box-shadow: 0 0 25px rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 bg-[#030712]">

    <header class="w-full max-w-6xl mx-auto border border-slate-800 bg-slate-900/50 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 font-mono text-xs backdrop-blur-sm">
        <div>
            <h1 class="text-base font-bold text-blue-400 tracking-wider">KUTS_CONSTITUTIONAL_COMPLIANCE</h1>
            <p class="text-slate-500 text-[0.6rem] uppercase tracking-wider">Category 12 // Systemic Auditing Matrix // Invariant TDS & Statutory Verification[cite: 8]</p>
        </div>
        <div class="text-right">
            <span class="text-blue-400 font-bold bg-blue-950/40 px-2 py-0.5 rounded border border-blue-900/30 text-[0.55rem]">AUDITOR CROSS-SUITE LIVE</span>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Audit Injector -->
        <section class="lg:col-span-4 bg-slate-900/50 border border-slate-800 rounded-xl p-5 glow-blue backdrop-blur-sm">
            <h2 class="text-xs text-blue-400 font-bold tracking-widest uppercase border-b border-slate-800 pb-3 mb-4 font-mono">Inject Manual Audit Entry</h2>
            <form id="compliance-injector-form" onsubmit="injectAudit(event)" class="space-y-4 font-mono text-xs">
                <div>
                    <label class="block text-slate-500 text-[0.6rem] mb-1">SOURCE NETWORK NODE ID</label>
                    <input type="text" id="comp-source" required class="w-full bg-black border border-slate-800 p-2.5 rounded text-blue-400 font-bold uppercase tracking-wider">
                </div>
                <div>
                    <label class="block text-slate-500 text-[0.6rem] mb-1">GROSS ASSET VALUE (Ꝃ)</label>
                    <input type="number" id="comp-gross" required class="w-full bg-black border border-slate-800 p-2.5 rounded text-slate-200">
                </div>
                <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded font-bold uppercase tracking-widest text-[0.65rem]">Commit Verification Pulse</button>
            </form>
        </section>

        <!-- Audit Stream Records -->
        <section class="lg:col-span-8 bg-slate-900/30 border border-slate-800 rounded-xl p-5 overflow-hidden">
            <h2 class="text-xs text-slate-300 font-bold tracking-widest uppercase font-mono border-b border-slate-800 pb-3 mb-4">Constitutional Audit Stream Records</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse font-mono text-xs">
                    <thead>
                        <tr class="text-slate-500 uppercase text-[0.6rem] border-b border-slate-800">
                            <th class="p-3">Audit Key</th>
                            <th class="p-3">Gross Block</th>
                            <th class="p-3 text-red-400">1% TDS Sweep</th>
                            <th class="p-3 text-emerald-400">1% RSP Pool</th>
                            <th class="p-3 text-right">Net Settled</th>
                        </tr>
                    </thead>
                    <tbody id="audit-body" class="divide-y divide-slate-800 text-slate-300"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./core/kuts-core-bridge.js"></script>
    <script src="./kuts-economics.js"></script>
    <script>
        function injectAudit(e) {
            e.preventDefault();
            const source = document.getElementById('comp-source').value;
            const gross = parseFloat(document.getElementById('comp-gross').value);
            
            // Execute Triple-Split Logic
            const split = window.KUTS_ECONOMICS.executeTripleSplit(gross);
            
            const row = `
                <tr class="border-b border-slate-800">
                    <td class="p-3 text-blue-400">${Math.random().toString(36).substr(2, 8).toUpperCase()}</td>
                    <td class="p-3">${gross.toFixed(2)} Ꝃ</td>
                    <td class="p-3 text-red-400">-${split.distributions.tds} Ꝃ</td>
                    <td class="p-3 text-emerald-400">-${split.distributions.rsp} Ꝃ</td>
                    <td class="p-3 text-right font-bold text-emerald-400">${split.distributions.worker} Ꝃ</td>
                </tr>
            `;
            document.getElementById('audit-body').insertAdjacentHTML('afterbegin', row);
            e.target.reset();
        }
    </script>
<!-- Resilient Inline Auth & Navigation Injector for Local Testing -->
    <script>
        (function() {
            window.addEventListener('DOMContentLoaded', () => {
                // Check session; if missing during local test, auto-initialize a mock test session instead of failing
                let session = localStorage.getItem('kuts_active_session');
                if (!session) {
                    session = JSON.stringify({ nodeId: "THRINC000-LOCAL-TEST", expiry: Date.now() + 86400000 });
                    localStorage.setItem('kuts_active_session', session);
                }

                // Inject Global Header if missing
                if (!document.getElementById('kuts-global-header')) {
                    const headerHTML = `
                        <header id="kuts-global-header" class="w-full max-w-7xl mx-auto p-6 flex justify-between items-center border-b border-slate-800 bg-[#030712] text-slate-200 mb-6">
                            <div class="text-blue-400 font-mono font-bold tracking-widest text-sm">
                                KUTS_MESH_OPERATIONS // MDI6000 [LOCAL MODE]
                            </div>
                            <nav id="nav-auth" class="flex gap-4 items-center font-mono"></nav>
                        </header>`;
                    document.body.insertAdjacentHTML('afterbegin', headerHTML);
                }

                // Inject Global Footer if missing
                if (!document.getElementById('kuts-global-footer') && !window.location.pathname.includes('index.html')) {
                    const footerHTML = `
                        <footer id="kuts-global-footer" class="max-w-7xl mx-auto mt-auto py-8 border-t border-slate-800 text-center w-full">
                            <a href="index.html" class="inline-flex items-center gap-2 text-[0.7rem] text-slate-500 hover:text-blue-400 font-mono uppercase tracking-widest transition-all">
                                <span class="text-lg">←</span> RETURN TO UNIVERSAL GATEWAY
                            </a>
                        </footer>`;
                    document.body.insertAdjacentHTML('beforeend', footerHTML);
                }

                updateAuthUI();
            });

            window.updateAuthUI = function() {
                const nav = document.getElementById('nav-auth');
                if (!nav) return;
                
                nav.innerHTML = `
                    <a href="index.html" class="text-slate-400 text-[0.65rem] uppercase font-mono hover:text-white">Gateway</a>
                    <button onclick="secureLogout()" class="bg-red-950 hover:bg-red-900 text-red-400 font-mono text-[0.65rem] px-3 py-1.5 rounded border border-red-900 uppercase tracking-widest cursor-pointer">
                        [X] DISCONNECT
                    </button>`;
            };

            window.secureLogout = function() {
                localStorage.removeItem('kuts_active_session');
                window.location.href = 'sign-in.html';
            };
        })();
    </script>
</body>
</html>
