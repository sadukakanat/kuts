<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KUTS Nanosecond Resolution Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="p-6 bg-[#030712] text-slate-100 flex justify-center items-center min-h-screen font-mono">

    <div class="glass-panel border border-cyan-500/40 rounded-2xl p-6 max-w-md w-full bg-slate-900/80 shadow-2xl">
        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
            <div>
                <span class="text-[0.6rem] text-cyan-400 uppercase tracking-widest block">KUTS Core Subsystem</span>
                <h3 class="text-sm font-bold text-slate-100 uppercase">Nanosecond Resolution Module</h3>
            </div>
            <span class="text-[0.6rem] text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-900/40">Active (1ns Scale)</span>
        </div>

        <div class="space-y-4">
            <div class="bg-black/60 border border-slate-800 rounded-xl p-4 text-center">
                <span class="text-[0.55rem] text-slate-500 uppercase tracking-wider block mb-1">Estimated Nanosecond Tick Count</span>
                <span id="module-scale-ns" class="text-xl font-bold text-cyan-400">0 ns</span>
                <p class="text-[0.5srem] text-slate-600 mt-1">High-frequency performance counter sync</p>
            </div>
        </div>
    </div>

    <script>
        class KUTSAnanosecondEngine {
            constructor(callback) {
                this.callback = callback;
                this.start();
            }
            start() {
                setInterval(() => {
                    // performance.now() returns milliseconds with microsecond fractions (e.g. 0.001ms = 1 microsecond = 1000ns)
                    const nsTime = Math.floor(performance.now() * 1_000_000);
                    if (this.callback) {
                        this.callback(nsTime.toLocaleString());
                    }
                }, 10);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new KUTSAnanosecondEngine((nsVal) => {
                document.getElementById('module-scale-ns').innerText = `${nsVal} ns`;
            });
        });
    </script>
</body>
</html>
