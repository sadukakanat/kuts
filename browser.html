<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUTS Network Core Browser HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="core/auth-bridge.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght=300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050a15; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Share Tech Mono', monospace; }
        .terminal-box { border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 0 15px rgba(30, 58, 138, 0.15); }
        .pulse-blue { animation: b-glow 2.5s infinite ease-in-out; }
        @keyframes b-glow { 0%, 100% { border-color: rgba(59, 130, 246, 0.2); } 50% { border-color: rgba(59, 130, 246, 0.6); } }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 bg-[#030712]">

    <header class="w-full max-w-5xl mx-auto border border-blue-900/60 bg-slate-900/40 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4 mb-6 font-mono text-xs">
        <div>
            <h1 class="text-xl font-bold text-blue-400 tracking-wider">KUTS_CORE_BROWSER</h1>
            <p class="text-slate-400 text-[0.65rem]">DECENTRALIZED COORDINATE DECODER // DATA EXTRACTION ENGINE</p>
        </div>
        <div id="nav-auth" class="flex gap-4 items-center"></div>
    </header>

    <main class="w-full max-w-5xl mx-auto grid md:grid-cols-12 gap-6 flex-1 items-start">
        <!-- Your existing content sections here -->
        <section class="md:col-span-5 flex flex-col gap-6">
            <div class="bg-slate-900/50 border border-blue-900/40 rounded-xl p-5 flex flex-col gap-4 terminal-box pulse-blue">
                <div class="border-b border-blue-900/40 pb-2">
                    <h2 class="text-xs text-blue-400 font-bold tracking-widest uppercase font-mono">01. Query Ingestion</h2>
                    <p class="text-slate-400 font-sans text-[0.7rem] mt-0.5">Input a serialized KUTS ID code to split and parse its technical parameters.</p>
                </div>
                <form id="browser-form" class="flex flex-col gap-4 font-mono text-xs text-slate-300" onsubmit="event.preventDefault(); decodeKutsId();">
                    <input type="text" id="browser-input" placeholder="e.g., 10252041THRINCF395" required class="bg-black/60 border border-slate-800 rounded p-2 text-emerald-400 font-bold uppercase tracking-widest text-center select-all">
                    <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded border border-blue-500 text-xs tracking-wider uppercase">Analyze System Payload >></button>
                </form>
            </div>
        </section>

        <section class="md:col-span-7 bg-slate-900/20 border border-blue-900/30 rounded-xl p-4 terminal-box min-h-[460px] flex flex-col">
             <div id="browser-output-display" class="flex-1 flex flex-col gap-3 font-mono text-xs text-center text-slate-500 italic p-6">Awaiting coordinate footprint query ingestion matrix array initialization logs...</div>
        </section>
    </main>
<!-- Resilient Inline Auth & Navigation Injector for Local Testing -->
    <script>
        (function() {
            window.addEventListener('DOMContentLoaded', () => {
                // Check session; if missing during local test, auto-initialize a mock test session instead of failing
                let session = localStorage.getItem('kuts_active_session');
                if (!session) {
                    session = JSON.stringify({ nodeId: "THRINC000-LOCAL-TEST", expiry: Date.now() + 86400000 });
                    localStorage.setItem('kuts_active_session', session);
                }

                // Inject Global Header if missing
                if (!document.getElementById('kuts-global-header')) {
                    const headerHTML = `
                        <header id="kuts-global-header" class="w-full max-w-7xl mx-auto p-6 flex justify-between items-center border-b border-slate-800 bg-[#030712] text-slate-200 mb-6">
                            <div class="text-blue-400 font-mono font-bold tracking-widest text-sm">
                                KUTS_MESH_OPERATIONS // MDI6000 [LOCAL MODE]
                            </div>
                            <nav id="nav-auth" class="flex gap-4 items-center font-mono"></nav>
                        </header>`;
                    document.body.insertAdjacentHTML('afterbegin', headerHTML);
                }

                // Inject Global Footer if missing
                if (!document.getElementById('kuts-global-footer') && !window.location.pathname.includes('index.html')) {
                    const footerHTML = `
                        <footer id="kuts-global-footer" class="max-w-7xl mx-auto mt-auto py-8 border-t border-slate-800 text-center w-full">
                            <a href="index.html" class="inline-flex items-center gap-2 text-[0.7rem] text-slate-500 hover:text-blue-400 font-mono uppercase tracking-widest transition-all">
                                <span class="text-lg">←</span> RETURN TO UNIVERSAL GATEWAY
                            </a>
                        </footer>`;
                    document.body.insertAdjacentHTML('beforeend', footerHTML);
                }

                updateAuthUI();
            });

            window.updateAuthUI = function() {
                const nav = document.getElementById('nav-auth');
                if (!nav) return;
                
                nav.innerHTML = `
                    <a href="index.html" class="text-slate-400 text-[0.65rem] uppercase font-mono hover:text-white">Gateway</a>
                    <button onclick="secureLogout()" class="bg-red-950 hover:bg-red-900 text-red-400 font-mono text-[0.65rem] px-3 py-1.5 rounded border border-red-900 uppercase tracking-widest cursor-pointer">
                        [X] DISCONNECT
                    </button>`;
            };

            window.secureLogout = function() {
                localStorage.removeItem('kuts_active_session');
                window.location.href = 'sign-in.html';
            };
        })();
    </script>
</body>
</html>
