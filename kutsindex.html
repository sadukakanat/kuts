<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUTS Network | Initializing Gateway...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050a15; color: #3b82f6; font-family: 'Share Tech Mono', monospace; }
        .loading-bar { animation: load 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
    <script>
        setTimeout(function() {
            // Extracts the exact current directory URL path from the gateway address
            var currentPath = window.location.pathname;
            
            // Replaces "index.html" or appends "KUTS_Module_Menu.html" safely preserving the CID scope
            if (currentPath.endsWith('/') || currentPath === '') {
                window.location.replace(window.location.origin + currentPath + "KUTS_Module_Menu.html");
            } else {
                var newPath = currentPath.substring(0, currentPath.lastIndexOf("/")) + "/KUTS_Module_Menu.html";
                window.location.replace(window.location.origin + newPath);
            }
        }, 1500); // 1.5-second hold for cross-gateway network handshakes
    </script>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-6 select-none relative overflow-hidden">
    
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#0f172a_1px,transparent_1px),linear-gradient(to_bottom,#0f172a_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] z-0 opacity-40"></div>

    <div class="z-10 text-center max-w-md w-full border border-blue-900/40 bg-slate-900/40 backdrop-blur-md p-8 rounded-2xl shadow-2xl">
        <div class="text-xs uppercase tracking-widest text-slate-500 mb-2">System Authentication</div>
        <h1 class="text-2xl font-bold tracking-widest text-blue-400 mb-6 animate-pulse">KUTS_WORKSPACE</h1>
        
        <div class="w-full bg-slate-950 border border-slate-800 rounded-full h-3 p-0.5 overflow-hidden mb-4">
            <div class="loading-bar bg-gradient-to-r from-blue-500 to-indigo-500 h-full rounded-full"></div>
        </div>
        
        <div class="space-y-1 text-left text-[0.68rem] text-slate-400 border-t border-slate-800/60 pt-4">
            <div class="flex justify-between"><span>[OK] PROTOCOL INJECTOR</span> <span class="text-emerald-400">ACTIVE</span></div>
            <div class="flex justify-between"><span>[OK] TARGET ENTRY NODE</span> <span class="text-blue-400">MASTER MODULE MENU</span></div>
            <div class="flex justify-between"><span>[SYS] MISSION STATUS</span> <span class="text-slate-500">MDI6000 // AAROHAN 2050</span></div>
        </div>
    </div>

    <div class="absolute bottom-4 text-center text-[0.6rem] text-slate-600 tracking-wider z-10">
        4x4x4 OPERATION CODES REGISTERED // STANDBY FOR REDIRECTION
    </div>

</body>
</html>
