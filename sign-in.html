<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KUTS | Identity Auth Node</title>
    <!-- Use Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ensure this path exactly matches your folder structure -->
    <script src="core/auth-bridge.js"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen text-slate-200">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <h2 class="text-indigo-400 font-bold mb-6 font-mono uppercase tracking-widest text-center">Identity Auth Node</h2>
        
        <form id="auth-form" class="space-y-4 font-mono text-xs">
            <div>
                <label class="block text-slate-500 mb-1">NODE IDENTIFIER</label>
                <input type="text" id="node-id" required class="w-full bg-black border border-slate-700 p-2 rounded text-indigo-300 uppercase tracking-widest text-center font-bold">
            </div>
            <div>
                <label class="block text-slate-500 mb-1">SIGNATURE KEY</label>
                <input type="password" id="sig-key" required class="w-full bg-black border border-slate-700 p-2 rounded text-slate-200 text-center">
            </div>
            <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded uppercase tracking-wider mt-4 transition">
                Verify Handshake >>
            </button>
        </form>
        <p id="auth-status" class="mt-4 text-center text-xs font-mono"></p>
    </div>

    <script>
        document.getElementById('auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // This relies on auth-bridge.js being loaded correctly
            const nodeId = document.getElementById('node-id').value.toUpperCase();
            const sigKey = document.getElementById('sig-key').value;
            const status = document.getElementById('auth-status');

            // Verification logic (Ensure KUTS_CORE is defined in your bridges)
            if (nodeId && sigKey.length >= 8) {
                const session = { nodeId: nodeId, expiry: Date.now() + 3600000 };
                localStorage.setItem('kuts_active_session', JSON.stringify(session));
                status.innerText = "✔ Identity verified. Redirecting...";
                status.className = "mt-4 text-center text-xs font-mono text-emerald-400";
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } else {
                status.innerText = "✖ Auth failed. Identity mismatch.";
                status.className = "mt-4 text-center text-xs font-mono text-red-400";
            }
        });
    </script>
</body>
</html>
