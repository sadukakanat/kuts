<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUTS Global Ecosystem | Universal Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght=300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030712; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Share Tech Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Global Platform Navigation -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400 font-mono tracking-widest uppercase">KUTS_GENESIS</h1>
            <div class="flex gap-6 text-[0.7rem] font-mono uppercase tracking-widest text-slate-400">
                <a href="#" onclick="loadModule('dashboard')" class="hover:text-blue-400">01. Learning</a>
                <a href="#" onclick="loadModule('compliance')" class="hover:text-blue-400">02. Operations</a>
                <a href="#" onclick="loadModule('registry')" class="hover:text-blue-400">03. Collaboration</a>
            </div>
        </div>
    </nav>

    <!-- Micro-Frontend Container Shell -->
    <main id="kuts-app-container" class="flex-1 max-w-7xl mx-auto w-full p-6">
        <div class="text-center mt-20">
            <h2 class="text-3xl font-bold text-slate-100 font-mono">Welcome to Aarohan 2050</h2>
            <p class="text-slate-500 mt-4 max-w-md mx-auto">Select a path from the navigation menu to activate your local KUTS node connection and enter the decentralized ecosystem.</p>
        </div>
    </main>

    <!-- Shared Platform Services -->
    <footer class="border-t border-slate-800 p-6 text-center text-[0.6rem] font-mono text-slate-600 uppercase tracking-widest">
        © 2026 PINALEAF ADVANCEMENTS LLP // MD16000 ARCHITECTURE // ORIGIN: THRINC000
    </footer>

    <script>
        // Orchestration Controller
        async function loadModule(moduleName) {
            const container = document.getElementById('kuts-app-container');
            const path = `./${moduleName}.html`;
            
            console.log("System State: Attempting to fetch:", path);
            
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Extract content
                const content = doc.querySelector('main') || doc.body;
                container.innerHTML = content.innerHTML;

                // Revive scripts
                doc.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) newScript.src = oldScript.src;
                    else newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
                
                console.log(`System State: ${moduleName} Module Synchronized.`);
            } catch (err) {
                console.error("Sync Error:", err);
                // Fallback for local file:// protocol
                container.innerHTML = `
                    <div class="p-6 border border-red-900 bg-red-950/20 text-red-400 font-mono text-xs text-center rounded">
                        <p>Synchronization Error: ${err.message}</p>
                        <p class="mt-2">If running locally, please use VS Code "Live Server" to bypass CORS policy.</p>
                    </div>`;
            }
        } // <-- Fixed: removed extra floating brace

        // Ecosystem Manifest Initializer
        async function initializeEcosystem() {
            try {
                // Points to the Assets sub-folder from the root
                const response = await fetch('./Assets/manifest.json');
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const ecosystemManifest = await response.json();
                console.log("System State: Manifest synchronized successfully.");
                
                // Ensure renderDynamicNavigation exists before calling it
                if (typeof renderDynamicNavigation === 'function') {
                    renderDynamicNavigation(ecosystemManifest);
                }
            } catch (err) {
                console.error("Manifest Sync Error:", err);
                document.getElementById('kuts-app-container').innerHTML = `
                    <div class="p-6 border border-red-900 bg-red-950/20 text-red-400 font-mono text-xs text-center rounded">
                        <p>Ecosystem Initialization Failed: ${err.message}</p>
                        <p class="mt-2">Please ensure manifest.json is inside your Assets folder and valid.</p>
                    </div>`;
            }
        }

        // Run on page load if needed
        window.addEventListener('DOMContentLoaded', initializeEcosystem);
    </script>
</body>
</html>
